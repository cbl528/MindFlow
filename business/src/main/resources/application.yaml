# =====================================================================
# MindFlow · business —— 主 RAG 服务配置
# 参照 RAGent bootstrap/application.yaml 整理，键名对齐 MindFlow 实际读取的 @ConfigurationProperties / @Value
# 使用说明：
#   - 值统一留 <填写>，按你的环境填写；「参考:」给出源项目 / 代码默认值，可作为填写的起点
#   - 有代码默认值的项不填也能跑（会用默认），但建议显式写清楚便于团队对齐
#   - 带 ${XXX:} 的写法表示「优先读环境变量 XXX，为空则用冒号后默认值」，密钥建议走环境变量而非写死
# =====================================================================

server:
  port: 8000                       # HTTP 监听端口（参考: 9090；当前工程原值 8000）
  servlet:
    context-path:              # 可选：全局 URL 前缀，留空则无前缀（源项目: /api/ragent）

spring:
  application:
    name: mindflow-business                     # 应用名（源项目: ragent-service；也用作日志 / 监控标识）

  servlet:
    multipart:                       # 上传体积上限（RemoteFileFetcher 远程抓取时也引用此项作单文件上限）
      max-file-size: 50MB            # 单文件上限
      max-request-size: 100MB        # 单次请求总体积上限

  datasource:                        # MyBatis-Plus 数据源（MySQL 8.x + HikariCP）
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/mindflow?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: mysql200528
    hikari:                          # HikariCP 连接池
      connection-timeout: 5000       # 获取连接超时(ms)
      idle-timeout: 600000           # 空闲连接最长存活(ms)
      max-lifetime: 1800000          # 连接最长存活(ms)，略小于数据库 wait_timeout
      maximum-pool-size: 10          # 最大连接数
      minimum-idle: 5                # 最小空闲连接数
      pool-name: MindFlowHikariPool               # 连接池名（参考: RagentHikariPool）

  data:
    redis:                           # Redis（StringRedisTemplate / Redisson / sa-token-redis 共用同一连接）
      host: localhost                # Redis 主机（参考: 127.0.0.1）
      port: 6379                     # Redis 端口（参考: 6379）
      password: redis200528          # Redis 密码；无密码留空
      database: 0                    # 库号（参考: 0）

rocketmq:                            # RocketMQ（rocketmq-spring-boot-starter）
  name-server: common-rocketmq-dev.magestack.cn:9876 # NameServer 地址
  producer:
    group: mindflow-producer         # 默认生产者组
    send-message-timeout: 2000       # 发送消息超时(ms)

# 多实例 / 多环境隔离后缀：代码中所有 RocketMQ topic 与消费组写作 xxx${unique-name:}，
# 在同一套 Broker 上区分不同部署实例，避免相互消费；单实例部署留空（务必留空，不要填占位符）
unique-name:

framework:
  cache:
    redis:
      prefix: "mindflow:"            # Redis key 统一前缀（配置后 RedisKeySerializer 自动启用，便于多环境隔离）

# =====================================================================
# AI 供应商与模型（对应 infra-ai 模块 AIModelProperties，prefix = ai）
# =====================================================================
ai:
  providers:                         # 供应商连接配置，key 被下方候选模型通过 provider 字段引用
    ollama:                          # 本地 Ollama
      url: http://localhost:11434    # 服务地址
      api-key:                       # 本地一般无需鉴权，留空
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:                         # 阿里云百炼（DashScope）
      url: https://dashscope.aliyuncs.com
      api-key: sk-ws-H.ELXHPLD.lnkI.MEQCIFZd7x803z5YWGuI1iIllSP6YVss3X0hFm5h8f7q64puAiBXwNTxX5MaYhNSKA8LPaCFPsq3a4YU51dYT8AuxAT3Jg                 # 或环境变量 BAILIAN_API_KEY
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:                     # 硅基流动
      url: https://api.siliconflow.cn
      api-key: sk-akheortxihrvmkcljxvmgjfmflinpmqjoebeknrlaqzwywzy                 # 或环境变量 SILICONFLOW_API_KEY
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    aihubmix:                        # AI Hub Mix（OpenAI 风格聚合网关）
      url: https://aihubmix.com
      api-key:                  # 或环境变量 AIHUBMIX_API_KEY
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:                         # 模型故障转移 / 熔断策略（按 tier 候选依次尝试）
    failure-threshold: 2             # 连续失败次数阈值，超过即熔断该候选
    open-duration-ms: 30000          # 熔断打开时长(ms)，到期进入半开探测恢复

  stream:
    message-chunk-size: 1            # 流式 SSE 单帧内容大小（1 = 逐字）

  # ---------- 聊天模型 ----------
  chat:
    default-tier: standard           # 默认档位名（请求未指定 tier 时的兜底档）
    deep-thinking-tier: deep         # 用户开启「深度思考」时的目标档位
    candidates:                      # 物理模型注册表：只登记 id→provider/model，档位排序由下方 tiers 定义
      # 硅基流动（SiliconFlow）chat 模型，优先级按下述顺序：① → ④
      - id: qwen-2.5-7b              # ① 通义千问 2.5-7B，中文优秀，32K 上下文，学习首选
        provider: siliconflow
        model: Qwen/Qwen2.5-7B-Instruct
      - id: qwen3-8b                 # ② Qwen3 8B，更新版本，综合更强
        provider: siliconflow
        model: Qwen/Qwen3-8B-Instruct
      - id: glm-4-9b                 # ③ GLM4-9B，中文表现好
        provider: siliconflow
        model: THUDM/glm-4-9b-chat
      - id: internlm2.5-7b           # ④ 书生 2.5-7B
        provider: siliconflow
        model: internlm/internlm2_5-7b-chat
    tiers:
      fast:                          # 低延迟档：标题 / 摘要 / 查询改写等轻任务（四个均为 ~7-9B 小模型，均可胜任）
        candidates: [ qwen-2.5-7b, qwen3-8b, glm-4-9b, internlm2.5-7b ]  # 候选顺序即故障转移优先级
        timeout-ms: 5000             # 该档位调用超时预算(ms)
      standard:                      # 默认档：质量 / 成本平衡（请求未指定 tier 时走这里）
        candidates: [ qwen-2.5-7b, qwen3-8b, glm-4-9b, internlm2.5-7b ]
        timeout-ms: 30000
      deep:                          # 深度思考档：本组均为非 thinking 模型，仅延长超时走同一链路
        candidates: [ qwen-2.5-7b, qwen3-8b, glm-4-9b, internlm2.5-7b ]
        timeout-ms: 120000

  # ---------- 向量嵌入模型 ----------
  embedding:
    default-model: bge-m3             # 默认嵌入模型 id（置顶优先），对应下方 candidates
    candidates:
      # 硅基流动（SiliconFlow）embedding 模型，优先级按下述顺序：① → ②
      - id: bge-m3                    # ① 学习项目首选，免费，多语言，长短文本通吃，RAG 标配
        provider: siliconflow
        model: BAAI/bge-m3
        dimension: ${rag.default.dimension}   # 向量维度，务必与 rag.default.dimension 一致（bge-m3 = 1024）
        priority: 1                   # 优先级，数值越小越优先
      - id: bge-large-zh-v1.5         # ② 中文通用向量，免费
        provider: siliconflow
        model: BAAI/bge-large-zh-v1.5
        dimension: ${rag.default.dimension}   # bge-large-zh-v1.5 = 1024，与 bge-m3 一致，可共用一个 Milvus 集合
        priority: 2

  # ---------- 重排序模型 ----------
  rerank:
    default-model: bge-reranker-v2-m3     # 默认 Rerank 模型 id（置顶优先），对应下方 candidates
    candidates:
      - id: bge-reranker-v2-m3            # 免费 rerank，中文检索重排，学习项目够用
        provider: siliconflow
        model: BAAI/bge-reranker-v2-m3
        priority: 1                       # 优先级，数值越小越优先

  # ---------- 视觉模型（图片图生文，知识库入库期用） ----------
  vlm:
    default-model: qwen-vl-max
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max

# =====================================================================
# RAG 引擎配置
# =====================================================================
rag:
  # ---------- 对象存储 ----------
  storage:
    type: s3                         # 存储后端：s3（MinIO / rustfs）/ oss（阿里云）
    kb-bucket: mindflow-sources        # 知识库桶（私有）：所有知识库文档共用，按 collectionName 目录隔离
    asset-bucket: mindflow-assets      # 多模态资产桶（公共读）：PDF 图片等供浏览器直连预览
    s3:                              # type=s3 时生效（本机 MinIO）
      endpoint: http://localhost:9000   # MinIO 端点（9000 端口）
      access-key: minioadmin         # MinIO 根账号的用户名即 AccessKey（默认 minioadmin）
      secret-key: minioadmin         # MinIO 根账号的密码即 SecretKey（默认 minioadmin；自定义过就填你自己的）
      region: us-east-1              # S3 兼容存储区域通常任填
      path-style: true               # MinIO / rustfs 必须为 true（false 走虚拟主机式寻址会 404）
      public-url:                    # 浏览器直连资产的公开基址；内外网端点不同时配置，留空回退 endpoint
    oss:                             # 未使用（type=oss 时才生效）
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      access-key: <填写>
      secret-key: <填写>
      region: cn-hangzhou
      public-url:

  # ---------- 向量库 ----------
  vector:
    type: milvus                     # 向量后端：当前仅实现 milvus（代码 matchIfMissing 默认即 milvus）

  # ---------- 关键词检索 ----------
  keyword:
    type: none                       # 关键词后端：none（关闭，默认）/ es（Elasticsearch）
    es:                              # 未使用（type=es 时才生效）
      uris: http://127.0.0.1:9200
      index: rag_keyword_store       # 全库共享索引，按 collection_name 字段区分知识库
      analyzer: ik_max_word          # 写入分词器
      search-analyzer: ik_smart      # 查询分词器

  # ---------- 知识图谱 ----------
  graph:
    type: none                       # 图谱后端：none（关闭，默认）/ lightrag
    lightrag:                        # 未使用（type=lightrag 时才生效）
      base-url: http://127.0.0.1:9621
      api-key:                       # 对应 X-API-Key 头；本地部署留空
      query-mode: mix                # 查询模式：naive / local / global / hybrid / mix
      timeout-ms: 30000              # 请求超时(ms)
    embedding-model: qwen-emb-8b     # 图谱侧 embedding 模型标识（未启用图谱时用不上）
    ingestion:                       # 向量写 → 图谱写同步开关（未启用图谱时用不上）
      enabled: false                 # false=冻结图谱写入；true=随向量写重建图谱
      async: true                    # 标脏入队 + 后台防抖重建，不阻塞主写链路
      global-workspace: false        # 是否额外写全局图 workspace

  # ---------- 默认值 ----------
  default:
    collection-name: rag_default_store   # 默认向量集合名
    dimension: 1024                   # 向量维度，须与 embedding 模型输出维度一致（bge-m3 / bge-large-zh-v1.5 均为 1024）
    metric-type: COSINE              # 向量度量：COSINE / L2 / IP
    sse-timeout-ms: 300000           # SSE 全局超时(ms)，防连接泄漏（默认 5 分钟）

  # ---------- 功能开关（RAGConfigProperties，@Value 读取） ----------
  query-rewrite:
    enabled: true                    # 查询改写 + 多问句拆分
  rerank:
    enabled: true                    # Rerank 重排序后置处理
  context:
    enrich:
      enabled: true                  # 检索末端回表补齐 chunk 文档归属并按文档聚合排序
  citation:
    enabled: true                    # 回答行内引用角标 [N](#cite-N)；不需要可改 false 降首字延迟

  # ---------- 全局并发限流（RAGRateLimitProperties，@Value 读取） ----------
  rate-limit:
    global:
      enabled: true                  # 是否启用全局限流
      max-concurrent: 10             # 最大并发数
      max-wait-seconds: 15           # 排队最大等待(秒)
      lease-seconds: 30              # 许可自动释放(秒)，兜底防泄漏
      poll-interval-ms: 200          # 排队轮询间隔(ms)

  # ---------- 会话记忆 ----------
  memory:
    history-keep-turns: 8            # 保留原文的最近轮数（user+assistant 视为一轮）
    summary-enabled: true            # 是否启用对话记忆压缩摘要
    summary-start-turns: 9           # 开始摘要的轮数阈值
    summary-max-chars: 400           # 摘要最大字数（200~1000）
    title-max-length: 30             # 会话标题最大长度（10~100）

  # ---------- 引导式问答（歧义检测 / 澄清） ----------
  guidance:
    enabled: true                    # 是否启用歧义检测与引导追问
    ambiguity-score-ratio: 0.8       # 歧义阈值：ratio >= 此值直接判定歧义触发澄清
    ambiguity-margin: 0.15           # 阈值缓冲区：ratio 落在此区间时进 LLM 二次确认
    max-options: 6                   # 单次最多展示的澄清选项数

  # ---------- RAG 调用链 Trace ----------
  trace:
    enabled: true                    # 是否启用注解式 Trace 采集
    max-error-length: 1000           # 错误信息落库最大长度

  # ---------- 知识库文档定时调度 ----------
  knowledge:
    schedule:
      scan-delay-ms: 10000           # 定时扫描间隔(ms)
      lock-seconds: 900              # 分布式锁持有时长(秒)
      batch-size: 20                 # 每次扫描批量大小
      min-interval-seconds: 60       # 单文档定时拉取最小间隔(秒)
      running-timeout-minutes: 30    # RUNNING 状态超时阈值(分钟)，超时重置为 FAILED

  # ---------- 分布式信号量（Redisson 限流） ----------
  semaphore:
    document-upload:                 # 文档上传并发许可
      name: rag:document:upload      # Redisson 信号量名
      max-concurrent: 10             # 最大并发
      max-wait-seconds: 5            # 获取许可最大等待(秒)
      lease-seconds: 300             # permit 自动释放(秒)

  # ---------- MCP 客户端（接入的外部 MCP Server） ----------
  mcp:
    servers:
      - name: default                # 服务名
        url: http://localhost:8001   # MCP 服务地址（本工程 mcp-service 的端口，需与 mcp-service/application.yaml 的 server.port 一致）

  # ---------- 检索通道与融合 ----------
  search:
    default-top-k: 10                # ③ 最终进 LLM 的条数（产品语义 topK）
    recall-budget: 20                # ① 每通道召回条数，须 ≥ default-top-k（<=0 回退 default-top-k）
    channels:
      vector:                        # 一条向量通道，按 KB 意图置信度内部二选一作用域
        enabled: true                # 向量通道总开关
        intent-directed:             # 有足够置信的 KB 意图时，收窄到命中库检索
          min-intent-score: 0.4      # 低于此分数的意图节点被过滤
        global:                      # 无 / 低置信 KB 意图时，退化为全库检索兜底
          confidence-threshold: 0.6          # KB 意图最高分低于此值 → 走全局
          single-intent-supplement-threshold: 0.8  # 仅单个 KB 意图且分数低于此值 → 全局兜底
          candidate-budget: 0        # 全局取数上限；<=0 跟随 rerank-candidate-limit
      keyword:
        enabled: false               # 关键词通道开关（需 rag.keyword.type=es 才真正生效）
      graph:
        enabled: false               # 图谱检索通道开关（需 rag.graph.type=lightrag）
      web-search:
        enabled: false               # 联网搜索通道开关
        count: 5                     # 最多返回条数（网页+新闻合计），上限 20
        timeout-seconds: 10          # 请求超时(秒)
        api-key:                     # You.com Search Key；留空回退环境变量 YDC_API_KEY
        api-url: https://ydc-index.io/v1/search
    fusion:                          # 多通道结果融合（后处理链首段）
      strategy: rrf                  # rrf（倒数名次融合，当前唯一实现）/ off
      rrf-k: 20                      # RRF 平滑常数 k，值越大越弱化高名次优势（候选池 20~40 条时用 20 区分度更好）
      rerank-candidate-limit: 40     # ② RRF 融合后送入 Rerank 的候选池上限；<=0 不截断
      channel-weights:               # 各通道 RRF 贡献权重（RRF 只用名次，加权控制通道话语权）
        vector: 1.0                  # 向量最可信
        keyword: 1.0
        graph: 0.5                   # 图谱新通道降权
        web-search: 0.5
        default-weight: 1.0          # 未显式配置通道的兜底权重

  # ---------- 图片解析（图生文） ----------
  image-parse:
    description-prompt: |-
      请把这张图片的内容转写成一段自包含的知识文本，用于知识库检索与问答，不要描述颜色、布局、字体等视觉样式。要求：
      1. 开头用一两句话说明这张图是什么（主题、类型、用途），让人不看图也能明白讲的是什么。
      2. 随后按图中的分组、层级、流程关系，完整转写所有文字内容（OCR），保留每个分组标题与其下属条目的归属关系，不要遗漏任何文字。
      3. 若是图表、架构图或流程图，请补充说明各部分之间的关系（如包含、调用、先后顺序），而不只是罗列文字。
      4. 保持术语准确完整，表述贴近用户可能的提问方式。
      5. 最后另起一行，用一句话自然引出图片（例如"下方为该内容对应的原始图片："），以便在这段文字后紧接着展示图片。
    max-output-tokens: 4096          # 描述输出 token 上限；<=0 不限制
    embedded-describe-enabled: true  # 是否给文档内嵌图也做图生文（关掉则内嵌图向量文本回落为一条图片 URL）

# =====================================================================
# Milvus 连接（rag.vector.type=milvus 时必需）
# =====================================================================
milvus:
  uri: http://localhost:19530        # Milvus 服务地址（本地默认端口）
  token:                             # 鉴权 Token；未开启鉴权留空

# =====================================================================
# MinerU SaaS（PDF / Word / PPT 深度解析）
# =====================================================================
mineru:
  api-url: https://mineru.net/api/v4
  api-key:                           # 或环境变量 MINERU_API_KEY
  poll-interval-seconds: 5           # 任务结果轮询间隔(秒)
  timeout-seconds: 300               # 单任务超时(秒)
  enable-table: true                 # 是否提取表格
  enable-formula: true               # 是否提取公式
  ocr: false                         # 是否强制 OCR（注意: 属性名必须写 ocr 而非 is-ocr）
  language: ch                       # 语言代码（PaddleOCR 规范，默认 ch = 中英文）
  concurrency-limit: 16              # 全局 outstanding 任务上限，防打爆 SaaS
  semaphore-name: rag:mineru:parse   # MinerU 解析分布式信号量名
  max-wait-seconds: 30               # 获取解析许可最大等待(秒)
  lease-seconds: 900                 # 许可自动释放(秒)，须 > timeout-seconds

# =====================================================================
# Sa-Token 登录鉴权
# =====================================================================
sa-token:
  token-name: Authorization          # token 请求头名（配合前端 Authorization 头）
  timeout: 2592000                   # token 有效期(秒)，2592000 = 30 天
  is-concurrent: true                # 是否允许同一账号并发登录
  is-share: false                    # 并发登录是否共享 token
  token-style: simple-uuid           # token 生成风格
  is-log: false                      # 是否输出操作日志
  is-print: false                    # 是否输出启动字符画

# =====================================================================
# 评测模式（EvalController + 检索归因切面）
# =====================================================================
app:
  eval:
    enabled: false                   # 生产关闭；评测环境改为 true 或 -Dapp.eval.enabled=true
